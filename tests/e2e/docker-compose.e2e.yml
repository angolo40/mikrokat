# Added by tests/e2e/run.sh only: it turns the HTTPS inspection profile on for the app, and the proxy also trusts the private CA of the test server.
services:
  # The app reads the profile from its environment, and .env of the host may not hold it.
  mikrokat:
    environment:
      COMPOSE_PROFILES: https
  tlsproxy:
    environment:
      SSL_CERT_FILE: /e2e/test-ca.pem
      # A local server, so no test calls the real list.
      TLS_BANK_LIST_URL: http://127.0.0.1:8099/bank.tar.gz
    volumes:
      - ${E2E_WORK:?run.sh sets this}/test-ca.pem:/e2e/test-ca.pem:ro
